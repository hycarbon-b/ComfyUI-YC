[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-openai-custom-base"
version = "1.0.0"
description = "ComfyUI plugin for OpenAI GPT Image generation with custom API endpoints"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
requires-python = ">=3.10"
keywords = ["comfyui", "openai", "gpt-image", "image-generation", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "requests>=2.28.0",
    "Pillow>=9.0.0",
    "numpy>=1.23.0",
    "torch>=2.0.0",
    "pydantic>=2.0.0",
    "aiohttp>=3.8.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/ComfyUI_OpenAI_CustomBase"
Documentation = "https://github.com/yourusername/ComfyUI_OpenAI_CustomBase#readme"
Repository = "https://github.com/yourusername/ComfyUI_OpenAI_CustomBase.git"
Issues = "https://github.com/yourusername/ComfyUI_OpenAI_CustomBase/issues"

[project.optional-dependencies]
dev = [
    "black>=22.0.0",
    "isort>=5.10.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
]

[tool.setuptools]
packages = ["ComfyUI_OpenAI_CustomBase"]

[tool.black]
line-length = 120
target-version = ["py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 120
