[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-openai-image-api"
version = "1.0.0"
description = "ComfyUI nodes for OpenAI Image Generation and Image Editing with custom base URL support"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "hycarbon-b" }]
requires-python = ">=3.10"
keywords = [
    "comfyui",
    "openai",
    "image-generation",
    "image-editing",
    "dall-e",
    "gpt-image",
    "ai",
    "stable-diffusion",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "requests>=2.28.0",
    "Pillow>=9.0.0",
    "numpy>=1.23.0",
    "torch>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/hycarbon-b/ComfyUI_OpenAI_ImageAPI"
Repository = "https://github.com/hycarbon-b/ComfyUI_OpenAI_ImageAPI"
Issues = "https://github.com/hycarbon-b/ComfyUI_OpenAI_ImageAPI/issues"
Changelog = "https://github.com/hycarbon-b/ComfyUI_OpenAI_ImageAPI/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["ComfyUI_OpenAI_ImageAPI*"]

[tool.setuptools.package-data]
"ComfyUI_OpenAI_ImageAPI" = ["*.md", "*.json"]
